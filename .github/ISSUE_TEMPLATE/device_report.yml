name: "💻 Device Compatibility Report"
description: "Report whether this preset works on your HP laptop model & Linux distro"
title: "[Device Test]: "
labels: ["device-compatibility", "community-tested"]
body:
  - type: markdown
    attributes:
      value: |
        Help us build the hardware compatibility database! Tell us your experience running this preset on your machine.
  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model
      description: Exact model number (check under your laptop or via `sudo dmidecode -s system-product-name`).
      placeholder: "e.g., HP 14s-fq2003au, HP 14s-dk0002au, HP 240 G8"
    validations:
      required: true
  - type: input
    id: audio_codec
    attributes:
      label: Audio Codec / Sound Card
      description: Run `cat /proc/asound/cards` or `pactl info`.
      placeholder: "e.g., Realtek ALC236, AMD ACP/HD Audio"
  - type: input
    id: os_distro
    attributes:
      label: Linux Distribution & Kernel
      description: Run `uname -r` and check your OS.
      placeholder: "e.g., Fedora 41 (Kernel 6.12), Arch Linux, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: test_result
    attributes:
      label: How does it sound?
      options:
        - "🌟 Works Flawlessly - Massive improvement over stock Linux audio"
        - "👍 Works Well - Sound is good, minor adjustments needed"
        - "⚠️ Mixed - Works but noticeable chassis vibration on high volume"
        - "❌ Broken / Distorted - Needs custom tuning"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Additional Notes & Impressions
      description: Describe what changed (bass, vocal clarity, volume level, speaker rattle).

name: "🎧 Submit a New Preset"
description: "Submit a new EasyEffects preset or sound profile for HP laptops"
title: "[Preset]: "
labels: ["preset", "community-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing a sound preset! Please fill out the details below.
  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model
      description: What HP laptop model was this preset created / tested on?
      placeholder: "e.g., HP 14s-fq2003au, HP 14s-dq2055wm, HP Pavilion 14"
    validations:
      required: true
  - type: input
    id: sound_signature
    attributes:
      label: Sound Signature / Purpose
      description: What type of sound profile is this?
      placeholder: "e.g., Bass Boost, Cinema / Movie, Podcast & Voice, Flat / Reference"
    validations:
      required: true
  - type: dropdown
    id: uses_convolver
    attributes:
      label: Does this preset use Convolver (IRS kernel)?
      options:
        - "Yes (bundled with .irs file)"
        - "No (pure parametric EQ / DSP)"
    validations:
      required: true
  - type: textarea
    id: irs_kernel_details
    attributes:
      label: IRS Kernel Details (if applicable)
      description: Kernel name, sample rate, and origin/attribution.
      placeholder: "Name: ..., Origin: ..., Sample rate: 48000 Hz"
  - type: checkboxes
    id: safety_checklist
    attributes:
      label: Safety & Quality Checklist
      description: Please verify that you tested the preset before submitting.
      options:
        - label: "I tested the preset at 100% volume and confirmed there is NO harsh clipping or speaker bottoming-out."
          required: true
        - label: "I included a peak limiter at the end of the chain (threshold ≤ -0.5 dB)."
          required: true
        - label: "I ran ./audio-test.sh and did not hear abnormal distortion."
          required: true
  - type: textarea
    id: preset_content
    attributes:
      label: Preset JSON or Link to PR
      description: Paste the EasyEffects preset JSON or provide a link to your Pull Request.
    validations:
      required: true

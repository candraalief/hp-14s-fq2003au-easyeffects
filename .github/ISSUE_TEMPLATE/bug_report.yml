name: "🐛 Bug Report"
description: "Report an issue with the installer script, audio distortion, or preset loading"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you encountered as clearly as possible.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What is happening?
      placeholder: "e.g., Audio cut off after running installer, EasyEffects cannot find kernel, audio clips at 80% volume..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System Environment
      description: Distribution, EasyEffects version, and PipeWire/WirePlumber version.
      placeholder: "Fedora 41, EasyEffects 7.2.1, WirePlumber 0.5.6"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `./install.sh`
        2. Open EasyEffects and select preset...
        3. Play music at volume...
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / EasyEffects Logs
      placeholder: "Paste output of `./install.sh` or terminal errors here"
